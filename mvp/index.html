<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guess the date poc</title>
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body>
    <section class="main">
      <div id="legend">
        <div>&#x1F973; Gagné</div>
        <div>&#x1F525; &leq; 25 ans</div>
        <div>&#x1F975; &leq; 50 ans</div>
        <div>&#x1F60E; &leq; 75 ans</div>
        <div>&#x1F976; &leq; 100 ans</div>
        <div>&#x1F9CA; &gt; 100 ans</div>
      </div>
      <form id="answer-form">
        <img src="assets/img/gramophone.png" alt="Photo d'un gramophone" />
        <p>De quand date cet objet ?</p>
        <label for="user-answer">Votre réponse</label>
        <input type="number" name="user-answer" id="user-answer" />
        <button type="submit">Valider</button>
        <div id="feedback"></div>
        <div id="hints"></div>
      </form>
    </section>
    <script src="assets/main.js"></script>
  </body>
</html>
