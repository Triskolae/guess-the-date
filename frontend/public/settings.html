<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Manage your Guess the Date account settings and personal information."
    />

    <title>Settings | Guess the Date</title>

    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body>
    <header class="site-header">
      <a href="index.html" class="site-logo">Guess the Date</a>

      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li>
            <a href="game.html" class="play-game">Play</a>
          </li>
          <li>
            <a href="about.html">About</a>
          </li>
          <li>
            <a href="account.html" aria-current="page">My account</a>
          </li>
        </ul>
      </nav>
    </header>

    <main class="account-page">
      <header class="account-header">
        <h1>Settings</h1>

        <p>Manage your account information and preferences.</p>
      </header>

      <nav class="account-nav" aria-label="Account navigation">
        <ul>
          <li>
            <a href="account.html">Overview</a>
          </li>
          <li>
            <a href="badges.html">My badges</a>
          </li>
          <li>
            <a href="settings.html" aria-current="page">Settings</a>
          </li>
        </ul>
      </nav>

      <section class="settings-section">
        <h2>Profile information</h2>

        <form id="profile-settings-form" class="settings-form">
          <div class="form-field">
            <label for="settings-username">Username</label>

            <input
              type="text"
              id="settings-username"
              name="username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-field">
            <label for="settings-email">Email</label>

            <input
              type="email"
              id="settings-email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="button button-primary">
            Save changes
          </button>
        </form>
      </section>

      <section class="settings-section">
        <h2>Change password</h2>

        <form id="password-settings-form" class="settings-form">
          <div class="form-field">
            <label for="current-password">Current password</label>

            <input
              type="password"
              id="current-password"
              name="current-password"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-field">
            <label for="new-password">New password</label>

            <input
              type="password"
              id="new-password"
              name="new-password"
              autocomplete="new-password"
              required
            />
          </div>

          <div class="form-field">
            <label for="confirm-new-password">Confirm new password</label>

            <input
              type="password"
              id="confirm-new-password"
              name="confirm-new-password"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="button button-primary">
            Change password
          </button>
        </form>
      </section>

      <section class="settings-section account-management">
        <h2>Account</h2>

        <button type="button" class="button logout-button">
          Log out
        </button>
      </section>
    </main>

    <footer class="site-footer">
      <nav aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>

      <p>Guess the Date</p>
    </footer>

    <auth-modal></auth-modal>

    <script src="assets/components.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/config.js"></script>
  </body>
</html>
