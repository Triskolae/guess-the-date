<!doctype html>
<html lang="en">

  <head>

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Manage your Guess the Date account settings and personal information."
    />

    <title>Settings | Guess the Date</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
      href="https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Eagle+Lake&family=Fondamento:ital@0;1&family=Great+Vibes&family=Imperial+Script&family=Italianno&family=MonteCarlo&family=Quintessential&family=Updock&display=swap"
      rel="stylesheet"
    >

    <link rel="stylesheet" href="assets/style.css" />

  </head>

  <body class="account-body">
    <app-header></app-header>

<main class="account-page">

      <header class="account-header">
        <h1>Settings</h1>

        <p>Manage your account information and preferences.</p>
      </header>

      <nav class="account-nav" aria-label="Account navigation">
        <ul>
          <li>
            <a href="account.html">Overview</a>
          </li>
          <li>
            <a href="badges.html">My badges</a>
          </li>
          <li>
            <a href="settings.html" aria-current="page">Settings</a>
          </li>
        </ul>
      </nav>

      <section class="settings-section">
        <h2>Profile information</h2>

        <form id="profile-settings-form" class="settings-form">
          <div class="form-field">
            <label for="settings-username">Username</label>

            <input
              type="text"
              id="settings-username"
              name="username"
              autocomplete="username"
              required
            />
          </div>

          <div class="form-field">
            <label for="settings-email">Email</label>

            <input
              type="email"
              id="settings-email"
              name="email"
              autocomplete="email"
              required
            />
          </div>

          <button type="submit" class="button button-primary">
            Save changes
          </button>
          <p class="settings-feedback" id="profile-settings-feedback" role="status" aria-live="polite"></p>
        </form>

        <form id="email-verification-form" class="settings-form hidden">
          <div class="form-field">
            <label for="settings-verification-code">Email verification code</label>
            <input
              type="text"
              id="settings-verification-code"
              name="code"
              inputmode="numeric"
              autocomplete="one-time-code"
              pattern="[0-9]{6}"
              maxlength="6"
              required
            />
          </div>
          <button type="submit" class="button button-primary">Verify email</button>
          <p class="settings-feedback" id="email-verification-feedback" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="settings-section">
        <h2>Change password</h2>

        <form id="password-settings-form" class="settings-form">
          <div class="form-field">
            <label for="current-password">Current password</label>

            <input
              type="password"
              id="current-password"
              name="current-password"
              autocomplete="current-password"
              required
            />
          </div>

          <div class="form-field">
            <label for="new-password">New password</label>

            <input
              type="password"
              id="new-password"
              name="new-password"
              autocomplete="new-password"
              minlength="8"
              required
            />
          </div>

          <div class="form-field">
            <label for="confirm-new-password">Confirm new password</label>

            <input
              type="password"
              id="confirm-new-password"
              name="confirm-new-password"
              autocomplete="new-password"
              required
            />
          </div>

          <button type="submit" class="button button-primary">
            Change password
          </button>
          <p class="settings-feedback" id="password-settings-feedback" role="status" aria-live="polite"></p>
        </form>
      </section>

      <section class="settings-section account-management">
        <h2>Account</h2>

        <button type="button" class="button logout-button">
          Log out
        </button>
      </section>

    </main>

    <footer class="site-footer">

      <nav aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>

      <p>Guess the Date</p>

    </footer>

    <auth-modal></auth-modal>

    <script src="assets/components.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/config.js"></script>
    <script type="module" src="assets/auth_needed.js"></script>
    <script src="assets/settings.js"></script>

  </body>

</html>
