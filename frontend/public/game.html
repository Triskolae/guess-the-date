
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta
      name="description"
      content="Guess when the mystery object was created and travel through history."
    />

    <title>Play | Guess the Date</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Beau+Rivage&family=Cormorant+Infant:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Eagle+Lake&family=Fondamento:ital@0;1&family=Great+Vibes&family=Imperial+Script&family=Italianno&family=MonteCarlo&family=Quintessential&family=Updock&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="assets/style.css" />
  </head>

  <body class="page-game">
    <app-header></app-header>

    <main class="game-page">
      <section class="game" aria-labelledby="object-question">

        <!-- Contenu principal de la feuille -->
        <div class="game-content">

          <!-- Colonne gauche : objet mystère -->
          <div class="game-object">
            <div class="game-object-frame">
              <img id="object-image" src="" alt="" />

              <p id="object-image-fallback" hidden>
                Image unavailable
              </p>
            </div>

            <h2 id="object-name"></h2>
          </div>

          <!-- Colonne droite : interactions -->
          <form id="answer-form" class="game-form">
            <p id="object-question"></p>

            <div class="answer-field">
              <label for="user-answer" class="sr-only">
                Your answer
              </label>

              <input
                type="number"
                name="user-answer"
                id="user-answer"
                placeholder="Enter a year"
                required
              />

              <button
                type="submit"
                class="button button-primary game-submit"
                aria-label="Submit your answer"
              >
                SUBMIT
              </button>
            </div>

            <!-- Retour chaud / froid -->
            <div
              id="feedback"
              class="game-feedback"
              aria-live="polite"
            ></div>

            <!-- Indices disponibles -->
            <div class="game-hint-actions">
              <button
                type="button"
                id="hint-one-button"
                class="game-hint-button"
                aria-label="Open first hint"
                aria-haspopup="dialog"
                hidden
              >
                <img
                  src="ressources-design/Ampoule-Idea.png"
                  alt=""
                />
                <span class="game-hint-label">First hint available!</span>
              </button>

              <button
                type="button"
                id="hint-two-button"
                class="game-hint-button"
                aria-label="Open second hint"
                aria-haspopup="dialog"
                hidden
              >
                <img
                  src="ressources-design/Ampoule-Idea.png"
                  alt=""
                />
                <span class="game-hint-label">Second hint available!</span>
              </button>
            </div>

            <!-- Contenu existant conservé pour main.js -->
            <div
              id="hints"
              class="game-hints"
              aria-live="polite"
              hidden
            ></div>

            <button
              type="button"
              id="next-object"
              class="button button-primary"
              hidden
            >
              NEXT OBJECT
            </button>
          </form>
        </div>

        <!-- Frise chronologique -->
        <section
          class="timeline-section"
          aria-labelledby="timeline-title"
        >
          <h2 id="timeline-title" class="sr-only">
            Timeline
          </h2>

          <div class="timeline">
            <div class="timeline-labels" aria-hidden="true">
              <span>← Past</span>
              <span>Present →</span>
            </div>

            <div class="timeline-track">
              <div
                id="timeline-ticks"
                class="timeline-ticks"
                aria-hidden="true"
              ></div>

              <div
                id="timeline-cursor"
                class="timeline-cursor"
                aria-hidden="true"
              ></div>
            </div>
          </div>
        </section>

        <!-- Légende accessible via le bouton information -->
        <aside class="game-help">
          <button type="button" id="legend-info-button" class="game-info-button" aria-label="Temperature guide" aria-haspopup="dialog" title="Temperature guide"><img src="ressources-design/info_sphere_clean.png" alt="" /></button>
        </aside>
      </section>
    </main>

    <dialog id="legend-modal" class="game-hint-modal">
      <div class="game-hint-modal-content">
        <button type="button" class="game-modal-close" aria-label="Close temperature guide">&times;</button>
        <h2>How close are you?</h2>
        <div class="game-legend">
          <div>🥳 Correct</div><div>🔥 1–24 years away — Burning</div>
          <div>🥵 25–49 years away — Hot</div><div>😎 50–79 years away — Warm</div>
          <div>🥶 80–99 years away — Cold</div><div>🧊 100+ years away — Freezing</div>
        </div>
      </div>
    </dialog>

    <!-- Modale du premier indice -->
    <dialog id="hint-one-modal" class="game-hint-modal">
      <div class="game-hint-modal-content">
        <button
          type="button"
          class="game-modal-close"
          aria-label="Close hint"
        >
          &times;
        </button>

        <h2>First clue</h2>
        <p id="hint-one-text"></p>
      </div>
    </dialog>

    <!-- Modale du deuxième indice -->
    <dialog id="hint-two-modal" class="game-hint-modal">
      <div class="game-hint-modal-content">
        <button
          type="button"
          class="game-modal-close"
          aria-label="Close hint"
        >
          &times;
        </button>

        <h2>Second clue</h2>
        <p id="hint-two-text"></p>
      </div>
    </dialog>

    <footer class="site-footer">
      <nav aria-label="Footer navigation">
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
      </nav>

      <p>Guess the Date</p>
    </footer>

    <auth-modal></auth-modal>

    <script src="assets/components.js"></script>
    <script type="module" src="assets/auth_needed.js"></script>
    <script src="assets/auth.js"></script>
    <script src="assets/config.js"></script>
    <script src="assets/game-objects.js"></script>
    <script src="assets/main.js"></script>
  </body>
</html>
