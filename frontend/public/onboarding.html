<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Onboarding</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fondamento:ital@0;1&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/style.css" />
  </head>
  <body class="onboarding">
    <main class="onboarding-wrapper">
      <article class="card">
        <header class="card-header">
          <span id="step-counter"></span>
        </header>
        <form id="onboarding-form">
          <section id="step-1" class="onboarding-step">
            <h2>Choose your game mode</h2>
            <div class="options-grid">
              <label class="option-card">
                <input type="radio" name="game_mode" value="casual" checked />
                <div class="card-content">
                  <span class="card-title">Casual</span>
                  <span class="card-subtitle"
                    >Play at your own pace, without pressure</span
                  >
                </div>
              </label>
              <label class="option-card">
                <input type="radio" name="game_mode" value="competitive" />
                <div class="card-content">
                  <span class="card-title">Competitive</span>
                  <span class="card-subtitle"
                    >Timed games and leaderboards</span
                  >
                </div>
              </label>
            </div>
            <div class="step-actions">
              <button
                type="button"
                class="button button-primary"
                id="btn-to-step-2"
              >
                NEXT
              </button>
            </div>
          </section>

          <section id="step-2" class="onboarding-step hidden">
            <h2>Choose your preferred era</h2>
            <div id="eras-container" class="options-grid"></div>
            <div class="step-actions">
              <button
                type="button"
                class="button button-secondary"
                id="btn-back-to-1"
              >
                BACK
              </button>
              <button
                type="button"
                class="button button-primary"
                id="btn-to-step-3"
              >
                NEXT
              </button>
            </div>
          </section>

          <section id="step-3" class="onboarding-step hidden">
            <h2>Choose your topics (max. 3)</h2>
            <p class="step-hint">Select up to 3 categories.</p>
            <div id="categories-container" class="options-grid"></div>
            <div class="step-actions">
              <button
                type="button"
                class="button button-secondary"
                id="btn-back-to-2"
              >
                BACK
              </button>
              <button type="submit" class="button button-primary">
                CONFIRM MY CHOICES
              </button>
            </div>
          </section>

          <section id="step-4" class="onboarding-step hidden">
            <h2>Setup complete!</h2>
            <p>Your preferences have been saved.</p>
            <div class="step-actions final-actions">
              <a href="index.html" class="button button-secondary">HOME</a>
              <a href="game.html" class="button button-primary"
                >START PLAYING</a
              >
            </div>
          </section>
        </form>
      </article>
    </main>

    <script src="assets/config.js"></script>
    <script src="assets/onboarding.js"></script>
  </body>
</html>
